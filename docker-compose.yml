version: '3.8'

services:
  # ============================================================================
  # NGINX LOAD BALANCER
  # ============================================================================
  nginx-lb:
    image: nginx:alpine
    container_name: hostelhub-nginx-lb
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - hostelhub-net
    restart: always

  # ============================================================================
  # BACKEND INSTANCE 1
  # ============================================================================
  backend-1:
    image: hostelhub:hardened
    container_name: hostel-backend-1
    environment:
      - PORT=3000
      - INSTANCE_ID=hostel-backend-node1
      - VITE_SUPABASE_URL=https://gnpprvzkpfcjjnpwshaa.supabase.co
      - VITE_SUPABASE_ANON_KEY=sb_publishable_SgEyaOCoYKc-5D1P4fVSAg_IX5puVkQ
      - JWT_SECRET=hostelhub-super-secret-jwt-key-2026
    ports:
      - "3001:3000"
    networks:
      - hostelhub-net
    restart: on-failure

  # ============================================================================
  # BACKEND INSTANCE 2
  # ============================================================================
  backend-2:
    image: hostelhub:hardened
    container_name: hostel-backend-2
    environment:
      - PORT=3000
      - INSTANCE_ID=hostel-backend-node2
      - VITE_SUPABASE_URL=https://gnpprvzkpfcjjnpwshaa.supabase.co
      - VITE_SUPABASE_ANON_KEY=sb_publishable_SgEyaOCoYKc-5D1P4fVSAg_IX5puVkQ
      - JWT_SECRET=hostelhub-super-secret-jwt-key-2026
    ports:
      - "3002:3000"
    networks:
      - hostelhub-net
    restart: on-failure

  # ============================================================================
  # BACKEND INSTANCE 3
  # ============================================================================
  backend-3:
    image: hostelhub:hardened
    container_name: hostel-backend-3
    environment:
      - PORT=3000
      - INSTANCE_ID=hostel-backend-node3
      - VITE_SUPABASE_URL=https://gnpprvzkpfcjjnpwshaa.supabase.co
      - VITE_SUPABASE_ANON_KEY=sb_publishable_SgEyaOCoYKc-5D1P4fVSAg_IX5puVkQ
      - JWT_SECRET=hostelhub-super-secret-jwt-key-2026
    ports:
      - "3003:3000"
    networks:
      - hostelhub-net
    restart: on-failure

networks:
  hostelhub-net:
    driver: bridge
