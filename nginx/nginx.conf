events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend cluster: 3 Docker container instances
    upstream backend_cluster {
        # Round-Robin distribution across 3 container replicas
        server backend-1:3000 max_fails=2 fail_timeout=5s;
        server backend-2:3000 max_fails=2 fail_timeout=5s;
        server backend-3:3000 max_fails=2 fail_timeout=5s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Add header to inspect which upstream node processed the response
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Proxied-By "Nginx-HostelHub-LoadBalancer";

        # Health check for Nginx itself
        location = /lb-health {
            return 200 "Nginx Load Balancer is UP and healthy\n";
            add_header Content-Type text/plain;
        }

        # Reverse Proxy for all HostelHub APIs
        location /api/ {
            proxy_pass http://backend_cluster;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # =================================================================
            # QUESTION 1(c): ZERO-DOWNTIME FAILOVER DIRECTIVES
            # =================================================================
            # AFTER RESILIENCY: High Availability Automatic Failover
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }

        # Root fallback
        location / {
            return 200 "HostelHub Load Balancer Gateway. Use /api/rooms/available or /api/health\n";
            add_header Content-Type text/plain;
        }
    }
}
